<div class="menu-page">
  @if (isPreOrderEnabled) {
    <div class="reservation-strip">
      You are making a pre-order for the reservation {{ preOrderReservationLabel }}.
    </div>
  }

  <div class="menu-container">
    <div class="page-navigation">
      <a routerLink="/main">Main page</a>
      <span>›</span>
      <span class="page-navigation__location">Menu</span>
    </div>

    <section class="hero-section">
      <app-main-cover-image src="assets/img/main-page-cover.webp" alt="Fresh restaurant dishes" />
      <div class="hero-text-block">
        <p class="hero-subtitle">Green &amp; Tasty Restaurants</p>
        <h1 class="hero-title">Menu</h1>
      </div>
    </section>

    <section class="content-sections">
      <div class="menu-section">
        <div class="filter-sort-bar">
          <nav class="category-buttons" aria-label="Dish categories">
            <button type="button" [class.active]="selectedCategory === null" (click)="selectAll()">
              All dishes
            </button>
            @for (category of menuCategories; track category) {
              <button
                type="button"
                [class.active]="selectedCategory === category"
                (click)="onCategorySelected(category)"
              >
                {{ menuCategoryLabels[category] }}
              </button>
            }
          </nav>

          <div class="sort-dropdown">
            <label for="sortSelect">Sort by:</label>
            <select id="sortSelect" [value]="selectedSort" (change)="onSortChanged($event)">
              @for (sort of sortChoices; track sort.value) {
                <option [value]="sort.value">{{ sort.label }}</option>
              }
            </select>
          </div>
        </div>

        <div class="dish-cards">
          @for (dish of filteredDishes; track dish.id) {
            <app-dish-card
              [dish]="dish"
              [preOrderEnabled]="isPreOrderEnabled"
              (dishClicked)="openModal(dish)"
              (preOrderClicked)="addDishToCart(dish)"
            ></app-dish-card>
          }
        </div>
      </div>
    </section>
  </div>

  @if (selectedDish) {
    <app-dish-modal
      [dish]="selectedDish"
      [preOrderEnabled]="isPreOrderEnabled"
      (preOrderClicked)="addDishToCart(selectedDish!)"
      (closed)="closeModal()"
    ></app-dish-modal>
  }
</div>
